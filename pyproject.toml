[project]
name = "huffman"
version = "0.1.0"
description = "Huffman Encoder project"
authors = [
    {name = "cfiscella",email = "chris2675@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ds @ git+https://github.com/cfiscella/ds.git"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.1"
black = "^24.10.0"

[tool.ruff]
exclude = ["venv", ".git", "__pycache__"]
fix = true
line-length = 88
select = ["E", "F", "I"]

[tool.ruff.per-file-ignores]
"tests/test_*.py" = ["E501"]

[tool.black]
line-length = 88
target-version = ["py311"]
